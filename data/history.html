<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto IOT</title>
    
    <!-- Librería Tailwind CSS para utilidades rápidas de diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Enlace a tu archivo CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- Navegador Superior (Navbar) -->
    <nav class="glass-navbar sticky top-0 z-50 flex items-center justify-between px-8 py-4 border-b border-gray-700 shadow-lg">
        <div class="flex items-center gap-3">
            <!-- Ícono de ejemplo -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <h1 class="text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                PROYECTO IOT
            </h1>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container mx-auto mt-12 px-4 max-w-5xl">
        
        <!-- Barra de Filtros -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 items-center justify-between bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
            <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                <!-- Filtro por Fecha -->
                <div class="flex items-center gap-2">
                    <label for="filtro-fecha" class="text-sm font-semibold text-gray-400">Fecha:</label>
                    <input type="date" id="filtro-fecha" class="bg-gray-900 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5 outline-none">
                </div>
                
                <!-- Filtro por Estado -->
                <div class="flex items-center gap-2">
                    <label for="filtro-estado" class="text-sm font-semibold text-gray-400">Estado:</label>
                    <select id="filtro-estado" class="bg-gray-900 border border-gray-600 text-gray-200 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5 outline-none">
                        <option value="Todos">Todos</option>
                        <option value="Normal">Normal</option>
                        <option value="Advertencia">Advertencia</option>
                        <option value="Alerta">Alerta</option>
                    </select>
                </div>
            </div>
            
            <!-- Botón Limpiar Filtros -->
            <button id="btn-limpiar" class="w-full md:w-auto bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-2 px-4 rounded-lg transition-colors border border-gray-600">
                Limpiar Filtros
            </button>
        </div>

        <!-- Tabla -->
        <div class="bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900 text-gray-400 uppercase text-sm leading-normal border-b border-gray-700">
                            <th class="py-4 px-6 text-center font-semibold">Fecha</th>
                            <th class="py-4 px-6 text-center font-semibold">Hora</th>
                            <th class="py-4 px-6 text-center font-semibold">Temperatura</th>
                            <th class="py-4 px-6 text-center font-semibold">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body" class="text-sm font-light">
                        <!-- Los datos se inyectarán aquí -->
                    </tbody>
                </table>

    <!-- Enlace a tu archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>
